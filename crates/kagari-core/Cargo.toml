[package]
name = "kagari-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# `serde` enables the value types' Serialize/Deserialize for persistence (#68).
kagari-base = { workspace = true, features = ["serde"] }
kagari-render = { workspace = true }
kagari-layout = { workspace = true }
kagari-style = { workspace = true }
kagari-text = { workspace = true }
reactive_graph = { workspace = true }
slotmap = { workspace = true }
# `serde` gives winit's `KeyCode` (and friends) Serialize/Deserialize for persisted keymap overrides (#68).
winit = { workspace = true, features = ["serde"] }
# Persistence (#68): RON (de)serialization of the persisted state + the OS config/data directory.
serde = { workspace = true }
ron = { workspace = true }
directories = { workspace = true }
# Accessibility (#67, specs §1.12): derive an accesskit tree from the element tree and sync it to the
# OS via the winit adapter. `accesskit` stays internal (kagari-owned `Role`).
accesskit = { workspace = true }
accesskit_winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# Dev theme hot-reload (#44): wires the kagari-style watcher to the App via the winit EventLoopProxy.
hot-reload = ["kagari-style/hot-reload"]

[dev-dependencies]
# Example-only: surfaces IME event flow + key pass-through logs for the manual IME
# test (docs/dev/ime-manual-test.md, #27). `env-filter` scopes RUST_LOG to our targets.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Shared headless-render + golden-image harness for the paint-pass pixel golden (#144).
kagari-golden = { workspace = true }

[[example]]
name = "hot_reload"
required-features = ["hot-reload"]

[lints]
workspace = true
