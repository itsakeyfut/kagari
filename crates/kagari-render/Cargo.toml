[package]
name = "kagari-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kagari-base = { workspace = true }
wgpu = { workspace = true }
# `derive` brings in the Pod/Zeroable derive macros for the GPU instance structs.
bytemuck = { workspace = true, features = ["derive"] }
# Shelf packing for the monochrome glyph/coverage atlas.
etagere = { workspace = true }
# Raster image decode (PNG/JPG) for the asset loader (#56).
image = { workspace = true }
# SVG parse + rasterization for named icons (#57); bundles usvg + tiny_skia.
resvg = { workspace = true }
# Path tessellation (fill/stroke → triangles) for the Path primitive (#58).
lyon = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Shared headless-render + golden-image harness (#144).
kagari-golden = { workspace = true }
# Encode in-memory PNG fixtures for the asset-loader golden (#56); also a normal dep above.
image = { workspace = true }
# block_on for wgpu's async adapter/device init in the device-loss recreate test (#64).
pollster = { workspace = true }

[lints]
workspace = true
