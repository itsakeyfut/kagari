[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# Workspace-wide unsafe policy (docs/rules/unsafe.md). Each crate inherits via
# `[lints] workspace = true`; safe crates additionally `#![forbid(unsafe_code)]`.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"

[workspace.dependencies]
# Internal crates (path + version centralized; each crate references via { workspace = true }).
kagari-base    = { path = "crates/kagari-base",    version = "0.0.0" }
kagari-render  = { path = "crates/kagari-render",  version = "0.0.0" }
kagari-style   = { path = "crates/kagari-style",   version = "0.0.0" }
kagari-layout  = { path = "crates/kagari-layout",  version = "0.0.0" }
kagari-text    = { path = "crates/kagari-text",    version = "0.0.0" }
kagari-core    = { path = "crates/kagari-core",    version = "0.0.0" }
kagari-widgets = { path = "crates/kagari-widgets", version = "0.0.0" }
kagari-macros  = { path = "crates/kagari-macros",  version = "0.0.0" }   # internal proc-macro (ident concat)
kagari-golden  = { path = "crates/kagari-golden",  version = "0.0.0" }   # dev-only headless+golden test harness

# External deps (versions centralized only; actually wired per-crate in implementation tasks M0-M9).
# Pinned to the latest stable minor at scaffold time (caret allows latest patch).
# winit stays on the 0.30 stable line; 0.31 is pre-release (beta) only.
# reactive_graph: kagari's fine-grained reactive runtime (adopted in #28; leptos lineage).
# `effects` is mandatory — without it `ImmediateEffect::new` is a no-op and effects never run.
# Pinned to the latest stable; 0.3.0 is alpha, excluded.
reactive_graph = { version = "0.2.14", features = ["effects"] }
wgpu = "29.0.3"
winit = "0.30.13"
taffy = "0.11"
slotmap = "1.1.1"          # retained node arena (kagari-core); generation-checked keys
cosmic-text = "0.19"
sys-locale = "0.3.2"
swash = "0.2.9"
etagere = "0.3"
lyon = "1.0.19"
resvg = "0.47"
image = "0.25.10"
bytemuck = "1.25"
glam = "0.33.1"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.228", features = ["derive"] }
ron = "0.12.2"
accesskit = "0.24.1"
accesskit_winit = "0.33.1"
raw-window-handle = "0.6.2"
directories = "6.0"
arboard = "3.6.1"            # OS clipboard (kagari-text TextBuffer; Linux uses pure-Rust x11rb)
pollster = "0.4"           # block_on for wgpu's async init inside winit's sync handlers
notify = "8.2.0"               # dev theme hot-reload file watcher (kagari-style, feature: hot-reload)

# dev (each crate references via { workspace = true } under [dev-dependencies]).
proptest = "1.11"
criterion = "0.8.2"
tempfile = "3.27.0"             # temp theme files in hot-reload tests
